<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXG — Tiempo</title>
<!-- T1.01 (16/11): tarjeta nueva compartida con la web (tiempo/tiempo.js), botón Actualizar y recarga cada 30 min. T1.00 (Daniel 16/11/2026): «pónmelo aparte, como la de subir». El tiempo de los próximos 7 días en Fuente Obejuna comparando AEMET, Meteored y AccuWeather (función tiempo). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXG Tiempo">
<link rel="apple-touch-icon" href="icon-tiempo-apple.png">
<link rel="icon" href="icon-tiempo-192.png">
<meta name="theme-color" content="#1B1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--asphalt:#1B1F24;--concrete:#EEECE6;--paper:#FBFAF7;--line:#E3DFD3;--ink:#1B1F24;--ink-soft:#6B7178;--orange:#D8560F;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden;overscroll-behavior-y:none;}
body{font-family:'Inter',sans-serif;background:var(--concrete);color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;}
header{padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
header .name{font-family:'Archivo',sans-serif;font-weight:800;font-size:14px;}
header .ver{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);margin-top:1px;}
header .sub{font-size:12px;color:var(--ink-soft);text-align:right;}
main{padding:12px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;}
header button{font:600 12px 'Inter',sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;}
header .der{display:flex;align-items:center;gap:10px;}
</style>
</head>
<body>
<header>
  <div><div class="name">EXG Tiempo</div><div class="ver" id="ver-tiempo">Tiempo T1.01</div></div>
  <div class="der"><div class="sub">Fuente Obejuna<br><span id="t-act"></span></div><button type="button" onclick="EXGTiempo.cargar(document.getElementById('lista'), document.getElementById('t-act'))">Actualizar</button></div>
</header>
<main>
  <div id="lista"></div>
</main>
<script src="tiempo/tiempo.js?v=V14.01"></script>
<script>
// Se carga al abrir, al volver a la app y cada 30 minutos mientras está abierta.
const recargar = () => EXGTiempo.cargar(document.getElementById('lista'), document.getElementById('t-act'));
recargar();
document.addEventListener('visibilitychange', () => { if(!document.hidden && Date.now() - EXGTiempo.ultima() > 60000) recargar(); });
setInterval(() => { if(!document.hidden) recargar(); }, 30 * 60000);
</script>
</body>
</html>
