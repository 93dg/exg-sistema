<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXG — Tiempo</title>
<!-- T1.00 (Daniel 16/11/2026): «pónmelo aparte, como la de subir». El tiempo de los próximos 7 días en Fuente Obejuna comparando AEMET, Meteored y AccuWeather (función tiempo). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXG Tiempo">
<link rel="apple-touch-icon" href="icon-tiempo-apple.png">
<link rel="icon" href="icon-tiempo-192.png">
<meta name="theme-color" content="#1B1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--asphalt:#1B1F24;--concrete:#EEECE6;--paper:#FBFAF7;--line:#E3DFD3;--ink:#1B1F24;--ink-soft:#6B7178;--orange:#D8560F;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden;overscroll-behavior-y:none;}
body{font-family:'Inter',sans-serif;background:var(--concrete);color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;}
header{padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
header .name{font-family:'Archivo',sans-serif;font-weight:800;font-size:14px;}
header .ver{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);margin-top:1px;}
header .sub{font-size:12px;color:var(--ink-soft);text-align:right;}
main{padding:12px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
.dia{font-weight:700;font-size:14px;padding:2px 0 4px;}
.lin{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.lin:last-child{border-bottom:none;}
.lin span:last-child{text-align:right;white-space:nowrap;}
.nota{font-size:11.5px;color:var(--ink-soft);line-height:1.45;padding:4px 2px;}
.vacio{text-align:center;color:var(--ink-soft);font-size:13px;padding:24px 0;}
</style>
</head>
<body>
<header>
  <div><div class="name">EXG Tiempo</div><div class="ver" id="ver-tiempo">Tiempo T1.00</div></div>
  <div class="sub">Fuente Obejuna<br><span id="t-act"></span></div>
</header>
<main>
  <div id="lista"><div class="vacio">Cargando…</div></div>
  <div class="nota" id="nota"></div>
</main>
<script>
const URL_TIEMPO = 'https://sshctqnpuolawtcujxkt.supabase.co/functions/v1/tiempo';
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const FU = [['aemet','AEMET'],['meteored','Meteored'],['accuweather','AccuWeather']];
const nomDia = iso => { const x = new Date(iso+'T00:00:00'), h = new Date(); h.setHours(0,0,0,0); const dd = Math.round((x - h) / 864e5); return dd === 0 ? 'Hoy' : dd === 1 ? 'Mañana' : DIAS[(x.getDay()+6)%7] + ' ' + x.getDate(); };
const val = v => { if(!v) return '—'; const p = [v.prob == null ? '—' : v.prob + ' %']; if(v.mm) p.push(String(v.mm).replace('.', ',') + ' l/m²'); if(v.max != null) p.push(v.max + '° / ' + v.min + '°'); return p.join(' · '); };
async function cargar(){
  const lista = document.getElementById('lista'), nota = document.getElementById('nota');
  let d;
  try{ d = await (await fetch(URL_TIEMPO, {cache:'no-store'})).json(); }
  catch(e){ lista.innerHTML = '<div class="vacio">Sin conexión con el tiempo ahora mismo</div>'; return; }
  lista.innerHTML = (d.dias || []).map(x => `<div class="card"><div class="dia">${nomDia(x.fecha)}</div>${FU.map(([k,n]) => `<div class="lin"><span>${n}</span><span>${val(x[k])}</span></div>`).join('')}</div>`).join('');
  const f = d.fuentes || {};
  const faltan = FU.filter(([k]) => f[k] && f[k].error).map(([k,n]) => n + (k === 'accuweather' && /clave/.test(f[k].error) ? ' (falta la clave de su servicio)' : ' (no responde ahora)'));
  nota.textContent = 'Probabilidad de lluvia del día y temperaturas máxima / mínima.' + (faltan.length ? ' Sin datos: ' + faltan.join(', ') + '.' : '');
  const t = new Date(d.actualizado || Date.now());
  document.getElementById('t-act').textContent = 'a las ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
}
cargar();
document.addEventListener('visibilitychange', () => { if(!document.hidden) cargar(); });
</script>
</body>
</html>
