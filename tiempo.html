<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXG — Tiempo</title>
<!-- T1.02 (16/11, Daniel: «algo que se vea moderno»): estilo app del tiempo a pantalla completa. T1.01 (16/11): tarjeta nueva compartida con la web (tiempo/tiempo.js), botón Actualizar y recarga cada 30 min. T1.00 (Daniel 16/11/2026): «pónmelo aparte, como la de subir». El tiempo de los próximos 7 días en Fuente Obejuna comparando AEMET, Meteored y AccuWeather (función tiempo). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXG Tiempo">
<link rel="apple-touch-icon" href="icon-tiempo-apple.png">
<link rel="icon" href="icon-tiempo-192.png">
<meta name="theme-color" content="#25323f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--asphalt:#1B1F24;--concrete:#EEECE6;--paper:#FBFAF7;--line:#E3DFD3;--ink:#1B1F24;--ink-soft:#6B7178;--orange:#D8560F;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden;overscroll-behavior-y:none;}
body{font-family:'Inter',sans-serif;background:#25323f;color:#fff;min-height:100vh;min-height:100dvh;overflow-x:hidden;}
/* T1.02: a pantalla completa, como una app del tiempo: el degradado llega arriba del todo y la cabecera va encima */
header{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(54px + env(safe-area-inset-top)) 16px 0;   /* T1.04 (Daniel 16/11): más abajo, que arriba el iPhone lo emborrona */
display:flex;align-items:center;justify-content:space-between;color:#fff;}
header .name{font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;opacity:.9;}
header .ver{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.55;margin-top:1px;}
header .der{display:flex;align-items:center;gap:10px;}
header .sub{font-size:11.5px;opacity:.75;text-align:right;}
header button{font:600 12px 'Inter',sans-serif;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
main{max-width:640px;margin:0 auto;}
#lista .tw{border-radius:0;box-shadow:none;min-height:100vh;min-height:100dvh;padding-top:calc(96px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));}
/* T1.04: el fondo de la página sigue el degradado del cielo, para que no quede una franja oscura abajo */
body[data-cielo="sol"]{background:#1d5fae;} body[data-cielo="claros"]{background:#2d5a8c;} body[data-cielo="nube"]{background:#3f5163;} body[data-cielo="lluvia"],body[data-cielo="tormenta"]{background:#25323f;} body[data-cielo="nieve"],body[data-cielo="niebla"]{background:#56687a;}
@media(min-width:641px){ main{padding:16px;} #lista .tw{border-radius:22px;min-height:0;} }
#lista .tw-vacio{color:rgba(255,255,255,.7);padding-top:120px;}
</style>
</head>
<body>
<header>
  <div><div class="name">EXG Tiempo</div><div class="ver" id="ver-tiempo" onclick="location.replace(location.pathname + '?r=' + Date.now())" title="Tocar para recargar">Tiempo T1.05</div></div>
  <div class="der"><div class="sub" id="t-act"></div><button type="button" onclick="recargar()">Actualizar</button></div>
</header>
<main>
  <div id="lista"></div>
</main>
<script src="tiempo/tiempo.js?v=V14.31"></script>
<script>
// Se carga al abrir, al volver a la app y cada 30 minutos mientras está abierta.
// T1.03 (Daniel 16/11: «lo tengo como app en el iPhone y no se actualiza»): el iPhone deja la app dormida en memoria y al volver
// no la vuelve a abrir. Ahora, cada vez que se vuelve a la app: si hay versión nueva publicada se recarga sola; si no, trae el tiempo nuevo.
const recargar = () => EXGTiempo.cargar(document.getElementById('lista'), document.getElementById('t-act')).then(() => { const t = document.querySelector('#lista .tw'); if(t) document.body.dataset.cielo = t.dataset.cielo; });
const verDe = t => ((t || '').match(/tiempo\.js\?v=(V[\d.]+)/) || [])[1] || '';
const VER_CARGADA = verDe(document.documentElement.innerHTML);
let _mirando = false;
async function alVolver(){
  if(document.hidden || _mirando) return; _mirando = true;
  try{
    const r = await fetch(location.pathname + '?vc=' + Date.now(), {cache: 'no-store'});
    if(r.ok){ const v = verDe(await r.text()); if(v && v !== VER_CARGADA){ location.replace(location.pathname + '?v=' + v); return; } }
  }catch(e){}
  _mirando = false;
  if(Date.now() - EXGTiempo.ultima() > 60000) recargar();
}
recargar();
document.addEventListener('visibilitychange', alVolver);
window.addEventListener('pageshow', e => { if(e.persisted) alVolver(); });
window.addEventListener('focus', alVolver);
setInterval(() => { if(!document.hidden) recargar(); }, 30 * 60000);
</script>
</body>
</html>
