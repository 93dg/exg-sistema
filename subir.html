<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXG — Subir foto</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXG">
<meta name="theme-color" content="#1B1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1B1F24;
  --asphalt-2:#262C33;
  --concrete:#EEECE6;
  --paper:#FBFAF7;
  --line:#D8D4C8;
  --ink:#1B1F24;
  --ink-soft:#5B6169;
  --orange:#D8560F;
  --green:#3C6E47;
  --green-soft:#DCE8DD;
  --red:#B23A2E;
  --red-soft:#F3D9D5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--concrete);
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--asphalt);
  color:#fff;
  padding:20px 20px 18px;
  text-align:center;
  position:sticky;top:0;z-index:10;
}
header .name{
  font-family:'Archivo',sans-serif;
  font-weight:800;
  font-size:19px;
  letter-spacing:0.01em;
}
header .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#8B929C;
  margin-top:3px;
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:18px;
  padding:20px 18px 100px;
  max-width:480px;
  margin:0 auto;
  width:100%;
}

.opciones{
  display:flex;
  gap:12px;
}
.opcion{
  -webkit-appearance:none;appearance:none;border:none;
  flex:1;
  padding:18px 14px;
  border-radius:10px;
  background:var(--paper);
  border:1.5px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  text-align:center;
  transition:transform .08s ease;
}
.opcion:active{transform:scale(0.96);}
.opcion.principal{background:var(--orange);border-color:var(--orange);}
.opcion .ico{
  width:40px;height:40px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--asphalt);
}
.opcion.principal .ico{background:rgba(255,255,255,0.18);}
.opcion .ico svg{width:20px;height:20px;}
.opcion .t1{font-size:14.5px;font-weight:700;color:var(--ink);}
.opcion.principal .t1{color:#fff;}

#campo-camara,#campo-galeria{display:none;}

/* -------- Lista de fotos pendientes -------- */
#lista-wrap{display:none;flex-direction:column;gap:12px;}
#lista-wrap.activo{display:flex;}
#lista-titulo{
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.03em;
}
#lista-fotos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.foto-item{
  position:relative;
  aspect-ratio:1/1;
  border-radius:10px;
  overflow:hidden;
  border:1.5px solid var(--line);
  background:var(--paper);
}
.foto-item img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-item .borrar{
  position:absolute;top:5px;right:5px;
  width:24px;height:24px;border-radius:50%;
  background:rgba(27,31,36,0.75);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;border:none;
}
.foto-item .estado-mini{
  position:absolute;bottom:0;left:0;right:0;
  padding:4px 6px;font-size:10.5px;font-weight:600;
  text-align:center;
}
.foto-item .estado-mini.ok{background:rgba(60,110,71,0.85);color:#fff;}
.foto-item .estado-mini.error{background:rgba(178,58,46,0.85);color:#fff;}
.foto-item .estado-mini.subiendo{background:rgba(27,31,36,0.75);color:#fff;}

#nota-wrap{display:flex;flex-direction:column;gap:6px;}
#nota-wrap label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
#nota{
  width:100%;
  min-height:64px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:var(--paper);
  padding:10px 12px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  color:var(--ink);
  resize:vertical;
}
#nota:focus{outline:none;border-color:var(--orange);}

#estado-general{
  min-height:20px;
  font-size:13.5px;
  font-weight:600;
  text-align:center;
}
#estado-general.ok{color:var(--green);}
#estado-general.error{color:var(--red);}
#estado-general.cargando{color:var(--ink-soft);}

/* -------- Barra inferior fija con Subir -------- */
#barra-inferior{
  position:fixed;left:0;right:0;bottom:0;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid var(--line);
  display:none;
}
#barra-inferior.activo{display:block;}
#btn-subir-todo{
  -webkit-appearance:none;appearance:none;border:none;
  width:100%;max-width:480px;margin:0 auto;display:block;
  padding:15px;border-radius:10px;
  background:var(--orange);color:#fff;
  font-size:16px;font-weight:700;
}
#btn-subir-todo:disabled{background:var(--line);color:var(--ink-soft);}

footer{
  text-align:center;
  padding:14px;
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  color:var(--ink-soft);
}
</style>
</head>
<body>

<header>
  <div class="name">Excavaciones Gómez</div>
  <div class="sub">SUBIR DOCUMENTO</div>
</header>

<main>
  <div class="opciones">
    <button type="button" class="opcion principal" id="btn-camara">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8a2 2 0 012-2h1.5l1-2h7l1 2H18a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="13" r="3.5" stroke="white" stroke-width="1.8"/>
        </svg>
      </span>
      <span class="t1">Hacer foto</span>
    </button>

    <button type="button" class="opcion" id="btn-galeria">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="#1B1F24" stroke-width="1.8"/>
          <circle cx="8.5" cy="9.5" r="1.5" stroke="#1B1F24" stroke-width="1.6"/>
          <path d="M5 16.5l4.5-4.5 3 3 3.5-3.5 4 4" stroke="#1B1F24" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="t1">Subir foto</span>
    </button>
  </div>

  <input id="campo-camara" type="file" accept="image/*" capture="environment">
  <input id="campo-galeria" type="file" accept="image/*" multiple>

  <div id="lista-wrap">
    <div id="lista-titulo">Fotos listas para subir</div>
    <div id="lista-fotos"></div>

    <div id="nota-wrap">
      <label for="nota">Nota (opcional)</label>
      <textarea id="nota" placeholder="Ej: albarán de la obra del Ayuntamiento, hoja 2"></textarea>
    </div>

    <div id="estado-general"></div>
  </div>
</main>

<div id="barra-inferior">
  <button type="button" id="btn-subir-todo">Subir</button>
</div>

<footer>Excavaciones Gómez</footer>

<script>
(function(){
  const SUPABASE_URL = "https://sshctqnpuolawtcujxkt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzaGN0cW5wdW9sYXd0Y3VqeGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDMxNDQsImV4cCI6MjEwNDUxOTE0NH0.NgqSwwtdQjKot2kiCabmF6f_kvl-27QU1kWgfzYPFsQ";
  const BUCKET = "documentos-exg";

  const btnCamara = document.getElementById("btn-camara");
  const btnGaleria = document.getElementById("btn-galeria");
  const campoCamara = document.getElementById("campo-camara");
  const campoGaleria = document.getElementById("campo-galeria");
  const listaWrap = document.getElementById("lista-wrap");
  const listaFotos = document.getElementById("lista-fotos");
  const nota = document.getElementById("nota");
  const estadoGeneral = document.getElementById("estado-general");
  const barraInferior = document.getElementById("barra-inferior");
  const btnSubirTodo = document.getElementById("btn-subir-todo");

  // Cada elemento: { file, previewUrl, id (interno) }
  let pendientes = [];
  let subiendo = false;

  btnCamara.addEventListener("click", () => campoCamara.click());
  btnGaleria.addEventListener("click", () => campoGaleria.click());

  campoCamara.addEventListener("change", () => {
    añadirArchivos(campoCamara.files);
    campoCamara.value = "";
  });
  campoGaleria.addEventListener("change", () => {
    añadirArchivos(campoGaleria.files);
    campoGaleria.value = "";
  });

  function añadirArchivos(fileList){
    Array.from(fileList).forEach(f => {
      pendientes.push({
        id: "f" + Date.now() + Math.random().toString(36).slice(2),
        file: f,
        previewUrl: URL.createObjectURL(f)
      });
    });
    render();
  }

  function quitar(id){
    pendientes = pendientes.filter(p => p.id !== id);
    render();
  }
  window.quitarFotoPendiente = quitar;

  function render(){
    if (pendientes.length === 0){
      listaWrap.classList.remove("activo");
      barraInferior.classList.remove("activo");
      return;
    }
    listaWrap.classList.add("activo");
    barraInferior.classList.add("activo");
    btnSubirTodo.disabled = subiendo;
    btnSubirTodo.textContent = subiendo
      ? "Subiendo…"
      : `Subir ${pendientes.length} foto${pendientes.length > 1 ? "s" : ""}`;

    listaFotos.innerHTML = pendientes.map(p => `
      <div class="foto-item" data-id="${p.id}">
        <img src="${p.previewUrl}" alt="Foto">
        ${!subiendo ? `<button type="button" class="borrar" onclick="quitarFotoPendiente('${p.id}')">✕</button>` : ""}
      </div>
    `).join("");
  }

  btnSubirTodo.addEventListener("click", subirTodo);

  async function subirTodo(){
    if (subiendo || pendientes.length === 0) return;
    subiendo = true;
    estadoGeneral.textContent = "Subiendo…";
    estadoGeneral.className = "cargando";
    render();

    const notaTexto = nota.value.trim() || null;
    const loteId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2));
    const subidas = pendientes.length;
    let fallos = 0;

    for (const p of pendientes.slice()){
      const item = listaFotos.querySelector(`.foto-item[data-id="${p.id}"]`);
      try {
        const ahora = new Date();
        const fecha = ahora.toISOString().slice(0,10);
        const extension = (p.file.name.split(".").pop() || "jpg").toLowerCase();
        const nombreArchivo = `sin-clasificar/gastos/${fecha}/${ahora.getTime()}-${Math.random().toString(36).slice(2,7)}.${extension}`;

        const subidaResp = await fetch(
          `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${nombreArchivo}`,
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
              "apikey": SUPABASE_ANON_KEY,
              "Content-Type": p.file.type || "image/jpeg"
            },
            body: p.file
          }
        );
        if (!subidaResp.ok) throw new Error("storage " + subidaResp.status);

        const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${nombreArchivo}`;

        const filaResp = await fetch(`${SUPABASE_URL}/rest/v1/documentos`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "apikey": SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify({
            tipo: "otro",
            fecha: fecha,
            storage_path: nombreArchivo,
            file_name: p.file.name,
            file_url: fileUrl,
            source: "foto",
            status: "pendiente",
            lote_id: loteId,
            nota: notaTexto
          })
        });
        if (!filaResp.ok) throw new Error("tabla " + filaResp.status);

        const filaCreada = await filaResp.json();
        const documentoId = filaCreada && filaCreada[0] && filaCreada[0].id;

        if (item) {
          const mini = document.createElement("div");
          mini.className = "estado-mini ok";
          mini.textContent = "✓";
          item.appendChild(mini);
        }

        if (documentoId) {
          fetch(`${SUPABASE_URL}/functions/v1/clasificar-documento`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
              "apikey": SUPABASE_ANON_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ documento_id: documentoId })
          }).catch(() => {});
        }
      } catch (err) {
        fallos++;
        if (item) {
          const mini = document.createElement("div");
          mini.className = "estado-mini error";
          mini.textContent = "Error";
          item.appendChild(mini);
        }
      }
    }

    if (fallos === 0){
      estadoGeneral.textContent = `✅ ${subidas} foto${subidas > 1 ? "s" : ""} subida${subidas > 1 ? "s" : ""}`;
      estadoGeneral.className = "ok";
    } else {
      estadoGeneral.textContent = `${subidas - fallos} subidas, ${fallos} con error`;
      estadoGeneral.className = "error";
    }

    setTimeout(() => {
      pendientes = [];
      nota.value = "";
      estadoGeneral.textContent = "";
      estadoGeneral.className = "";
      subiendo = false;
      render();
    }, 1800);
  }
})();
</script>

</body>
</html>
