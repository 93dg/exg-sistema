<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXG — Subir foto</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXG">
<meta name="theme-color" content="#1B1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1B1F24;
  --asphalt-2:#262C33;
  --concrete:#EEECE6;
  --paper:#FBFAF7;
  --line:#D8D4C8;
  --ink:#1B1F24;
  --ink-soft:#5B6169;
  --orange:#D8560F;
  --green:#3C6E47;
  --green-soft:#DCE8DD;
  --red:#B23A2E;
  --red-soft:#F3D9D5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--concrete);
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--asphalt);
  color:#fff;
  padding:22px 20px 20px;
  text-align:center;
}
header .name{
  font-family:'Archivo',sans-serif;
  font-weight:800;
  font-size:20px;
  letter-spacing:0.01em;
}
header .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#8B929C;
  margin-top:3px;
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:28px 22px 44px;
}

.opciones{
  width:100%;
  max-width:340px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.opcion{
  -webkit-appearance:none;
  appearance:none;
  border:none;
  width:100%;
  padding:26px 20px;
  border-radius:10px;
  background:var(--paper);
  border:1.5px solid var(--line);
  display:flex;
  align-items:center;
  gap:16px;
  text-align:left;
  transition:transform .08s ease, border-color .08s ease;
}
.opcion:active{transform:scale(0.97);}
.opcion.principal{
  background:var(--orange);
  border-color:var(--orange);
}
.opcion .ico{
  width:46px;height:46px;flex:0 0 46px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--asphalt);
}
.opcion.principal .ico{background:rgba(255,255,255,0.18);}
.opcion .ico svg{width:24px;height:24px;}
.opcion .txt .t1{font-size:17px;font-weight:700;color:var(--ink);}
.opcion.principal .txt .t1{color:#fff;}
.opcion .txt .t2{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.opcion.principal .txt .t2{color:rgba(255,255,255,0.75);}

#campo-camara,#campo-galeria{display:none;}

#previa-wrap{
  width:100%;max-width:340px;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
#previa-wrap.activo{display:flex;}
#previa{
  width:140px;height:140px;
  border-radius:10px;
  object-fit:cover;
  border:1.5px solid var(--line);
}

#estado{
  min-height:24px;
  font-size:14px;
  font-weight:600;
  text-align:center;
}
#estado.ok{color:var(--green);}
#estado.error{color:var(--red);}
#estado.cargando{color:var(--ink-soft);}

footer{
  text-align:center;
  padding:14px;
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  color:var(--ink-soft);
}
</style>
</head>
<body>

<header>
  <div class="name">Excavaciones Gómez</div>
  <div class="sub">SUBIR DOCUMENTO</div>
</header>

<main>
  <div id="previa-wrap">
    <img id="previa" alt="Foto">
  </div>

  <div id="estado"></div>

  <div class="opciones" id="opciones">
    <button type="button" class="opcion principal" id="btn-camara">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8a2 2 0 012-2h1.5l1-2h7l1 2H18a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="13" r="3.5" stroke="white" stroke-width="1.8"/>
        </svg>
      </span>
      <span class="txt">
        <div class="t1">Hacer foto</div>
        <div class="t2">Recibo, albarán, factura, avería...</div>
      </span>
    </button>

    <button type="button" class="opcion" id="btn-galeria">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="#1B1F24" stroke-width="1.8"/>
          <circle cx="8.5" cy="9.5" r="1.5" stroke="#1B1F24" stroke-width="1.6"/>
          <path d="M5 16.5l4.5-4.5 3 3 3.5-3.5 4 4" stroke="#1B1F24" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="txt">
        <div class="t1">Subir foto</div>
        <div class="t2">De la galería</div>
      </span>
    </button>
  </div>

  <input id="campo-camara" type="file" accept="image/*" capture="environment">
  <input id="campo-galeria" type="file" accept="image/*">
</main>

<footer>Excavaciones Gómez</footer>

<script>
(function(){
  const SUPABASE_URL = "https://sshctqnpuolawtcujxkt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzaGN0cW5wdW9sYXd0Y3VqeGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDMxNDQsImV4cCI6MjEwNDUxOTE0NH0.NgqSwwtdQjKot2kiCabmF6f_kvl-27QU1kWgfzYPFsQ";
  const BUCKET = "documentos-exg";

  const btnCamara = document.getElementById("btn-camara");
  const btnGaleria = document.getElementById("btn-galeria");
  const campoCamara = document.getElementById("campo-camara");
  const campoGaleria = document.getElementById("campo-galeria");
  const estado = document.getElementById("estado");
  const previaWrap = document.getElementById("previa-wrap");
  const previa = document.getElementById("previa");
  const opciones = document.getElementById("opciones");

  btnCamara.addEventListener("click", () => campoCamara.click());
  btnGaleria.addEventListener("click", () => campoGaleria.click());
  campoCamara.addEventListener("change", () => subir(campoCamara.files[0]));
  campoGaleria.addEventListener("change", () => subir(campoGaleria.files[0]));

  async function subir(f){
    if (!f) return;

    previa.src = URL.createObjectURL(f);
    previaWrap.classList.add("activo");
    opciones.style.display = "none";
    estado.textContent = "Subiendo…";
    estado.className = "cargando";

    try {
      const ahora = new Date();
      const fecha = ahora.toISOString().slice(0,10);
      const extension = (f.name.split(".").pop() || "jpg").toLowerCase();
      const nombreArchivo = `sin-clasificar/gastos/${fecha}/${ahora.getTime()}.${extension}`;

      const subidaResp = await fetch(
        `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${nombreArchivo}`,
        {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "apikey": SUPABASE_ANON_KEY,
            "Content-Type": f.type || "image/jpeg"
          },
          body: f
        }
      );
      if (!subidaResp.ok) throw new Error("storage " + subidaResp.status);

      const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${nombreArchivo}`;

      const filaResp = await fetch(`${SUPABASE_URL}/rest/v1/documentos`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "apikey": SUPABASE_ANON_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          tipo: "otro",
          fecha: fecha,
          storage_path: nombreArchivo,
          file_name: f.name,
          file_url: fileUrl,
          source: "foto",
          status: "pendiente"
        })
      });
      if (!filaResp.ok) throw new Error("tabla " + filaResp.status);

      const filaCreada = await filaResp.json();
      const documentoId = filaCreada && filaCreada[0] && filaCreada[0].id;

      estado.textContent = "✅ Subido";
      estado.className = "ok";

      // Dispara el análisis automático sin bloquear ni esperar la respuesta
      if (documentoId) {
        fetch(`${SUPABASE_URL}/functions/v1/clasificar-documento`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "apikey": SUPABASE_ANON_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ documento_id: documentoId })
        }).catch(() => {});
      }
    } catch (err) {
      estado.textContent = "No se pudo subir. Inténtalo otra vez.";
      estado.className = "error";
    } finally {
      setTimeout(() => {
        previaWrap.classList.remove("activo");
        opciones.style.display = "flex";
        estado.textContent = "";
        estado.className = "";
        campoCamara.value = "";
        campoGaleria.value = "";
      }, 1600);
    }
  }
})();
</script>

</body>
</html>
