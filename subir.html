<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXG — Subir</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXG">
<meta name="theme-color" content="#1B1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1B1F24;
  --concrete:#EEECE6;
  --paper:#FBFAF7;
  --line:#E3DFD3;
  --ink:#1B1F24;
  --ink-soft:#6B7178;
  --orange:#D8560F;
  --orange-soft:#FBE4D6;
  --green:#3C6E47;
  --green-soft:#DCE8DD;
  --red:#B23A2E;
  --red-soft:#F3D9D5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Inter',sans-serif;background:var(--concrete);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;}
svg{display:block;}

header{padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);}
header .name{font-family:'Archivo',sans-serif;font-weight:800;font-size:14px;}
header .ver{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);margin-top:1px;}

#feed{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:9px;}
.msg{background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:10px;position:relative;animation:aparecer .2s ease;}
@keyframes aparecer{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.msg-fila{display:flex;gap:10px;align-items:flex-start;}
.msg-thumb{width:46px;height:46px;border-radius:9px;flex:0 0 46px;object-fit:cover;background:var(--asphalt);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;position:relative;cursor:pointer;}
.msg-adjuntos{display:flex;gap:6px;flex:0 1 auto;overflow-x:auto;}
.msg-adjuntos .msg-thumb{flex:0 0 46px;}
.msg-cuerpo{flex:1;min-width:0;padding-top:1px;}
.msg-texto{font-size:13.5px;color:var(--ink);line-height:1.35;word-wrap:break-word;}
.msg-meta{font-size:11px;color:var(--ink-soft);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.msg-pill{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;}
.msg-pill.pendiente{background:var(--concrete);color:var(--ink-soft);}
.msg-pill.revisar{background:var(--orange-soft);color:var(--orange);}
.msg-pill.validado{background:#e8f0fe;color:#1a73e8;} /* Añadido al sistema */
.msg-pill.verificado{background:#e8f5e9;color:#2e7d32;}
.msg.msg-plegado .msg-texto{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-soft);}
.msg.msg-plegado .msg-interpretacion{display:none;}
.msg.msg-plegado .msg-pie{display:none;}
.msg.msg-plegado .msg-adjuntos{display:none;}
.msg.msg-plegado{opacity:0.75;cursor:pointer;}
.msg.msg-plegado .msg-meta{opacity:0.7;}
.msg-pill.cargando{background:var(--concrete);color:var(--ink-soft);}
.msg-acciones{flex:0 0 auto;display:flex;gap:4px;}
.msg-icon-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--concrete);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.msg-icon-btn svg{width:12px;height:12px;}
.msg-icon-btn.borrar{background:var(--red-soft);color:var(--red);}
.play-badge{position:absolute;bottom:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;}
.play-badge svg{width:7px;height:7px;}

.msg-pie{display:flex;align-items:center;justify-content:space-between;margin-top:8px;border-top:1px solid var(--line);padding-top:7px;}
.btn-anadir{-webkit-appearance:none;appearance:none;border:1.3px dashed var(--line);background:none;border-radius:20px;padding:4px 11px 4px 8px;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.btn-anadir svg{width:14px;height:14px;}

#menu-anadir{position:fixed;inset:0;z-index:110;background:rgba(27,31,36,0.5);display:none;align-items:flex-end;justify-content:center;}
#menu-anadir.activo{display:flex;}
#menu-anadir-panel{width:100%;max-width:480px;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
#menu-anadir-panel .titulo{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:2px;}
.menu-anadir-opcion{-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px;display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:600;color:var(--ink);}
.menu-anadir-opcion svg{width:20px;height:20px;color:var(--orange);}

#vacio{margin:auto;text-align:center;color:var(--ink-soft);font-size:13.5px;padding:20px;}

#detalle{position:fixed;inset:0;z-index:100;background:rgba(27,31,36,0.55);display:none;align-items:flex-end;justify-content:center;}
#detalle.activo{display:flex;}
#detalle-panel{width:100%;max-width:480px;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
#detalle-panel img{width:100%;border-radius:11px;margin-bottom:10px;}
#detalle-panel audio{width:100%;margin-bottom:10px;}
#detalle-cerrar{width:32px;height:32px;border-radius:50%;background:var(--concrete);border:none;display:flex;align-items:center;justify-content:center;float:right;}
#detalle-cerrar svg{width:15px;height:15px;}

#control-inferior{background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;}
#pendientes-strip{display:none;gap:10px;overflow-x:auto;padding-bottom:2px;}
#pendientes-strip.activo{display:flex;}
.pend-item{position:relative;flex:0 0 auto;width:84px;height:84px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:var(--asphalt);}
.pend-item img{width:100%;height:100%;object-fit:cover;display:block;}
.pend-item .pend-audio{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;}
.pend-item .pend-audio svg{width:34px;height:34px;}
.pend-item .pend-borrar{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(27,31,36,0.82);border:none;color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;}

.acciones{display:flex;gap:9px;align-items:stretch;}
#btn-foto{-webkit-appearance:none;appearance:none;border:none;flex:1.4;background:var(--orange);color:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:9px;font-family:'Inter',sans-serif;font-size:15.5px;font-weight:700;}
#btn-foto:active{background:#c14c0d;}
#btn-foto svg{width:28px;height:28px;}
.btn-secundario{-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);background:var(--paper);flex:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--ink-soft);padding:6px 4px;}
.btn-secundario:active{background:var(--concrete);}
.btn-secundario svg{width:26px;height:26px;color:var(--ink);}
.btn-secundario.grabando{background:var(--red);border-color:var(--red);color:#fff;}
.btn-secundario.grabando svg{color:#fff;animation:pulso 1s infinite;}
@keyframes pulso{0%,100%{opacity:1;}50%{opacity:.5;}}
#campo-camara,#campo-archivo,#campo-anadir{display:none;}

#chat-bar{display:flex;gap:7px;align-items:center;}
#chat-texto{flex:1;border:1.5px solid var(--line);border-radius:21px;padding:10px 15px;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:#fff;}
#chat-texto:focus{outline:none;border-color:var(--orange);}
.btn-circular{-webkit-appearance:none;appearance:none;border:none;width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:flex;align-items:center;justify-content:center;}
.btn-circular svg{width:18px;height:18px;}
#btn-dictar{background:var(--concrete);color:var(--ink);}
#btn-dictar.escuchando{background:var(--red);color:#fff;}
#btn-dictar.escuchando svg{animation:pulso 1s infinite;}
#btn-enviar{background:var(--orange);color:#fff;}
#btn-enviar:disabled{background:var(--line);color:var(--ink-soft);}
</style>
</head>
<body>

<header>
  <div>
    <div class="name">EXG</div>
    <div class="ver">Subir S3.7 · Sistema V4.63</div>
  </div>
</header>
<button onclick="location.reload(true)" title="Actualizar" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;z-index:9999;background:none;border:none;padding:8px;cursor:pointer;color:var(--ink-soft);font-size:22px;line-height:1;">↻</button>

<main style="flex:1;display:flex;flex-direction:column;min-height:0;">
  <div id="feed"><div id="vacio">Haz una foto, sube un archivo, graba un audio o escribe abajo. El sistema lo clasifica solo.</div></div>
</main>

<div id="detalle">
  <div id="detalle-panel">
    <button type="button" id="detalle-cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
    <div style="clear:both;"></div>
    <div id="detalle-contenido"></div>
  </div>
</div>

<div id="menu-anadir">
  <div id="menu-anadir-panel">
    <div class="titulo">Añadir a este mensaje</div>
    <button type="button" class="menu-anadir-opcion" id="ma-foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-2h7l1 2H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button>
    <button type="button" class="menu-anadir-opcion" id="ma-archivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/><path d="M14 3v5h5" stroke-linejoin="round"/></svg>Galería / documento</button>
    <button type="button" class="menu-anadir-opcion" id="ma-audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/></svg>Grabar audio</button>
  </div>
</div>

<div id="control-inferior">
  <input id="campo-camara" type="file" accept="image/*" capture="environment">
  <input id="campo-archivo" type="file" accept="image/*,application/pdf" multiple>
  <input id="campo-anadir" type="file" accept="image/*,application/pdf">

  <div id="pendientes-strip"></div>

  <div class="acciones">
    <button type="button" id="btn-foto">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M9.2 4.5c-.4 0-.75.24-.9.6l-.6 1.4H5.5A2.5 2.5 0 0 0 3 9v9a2.5 2.5 0 0 0 2.5 2.5h13A2.5 2.5 0 0 0 21 18V9a2.5 2.5 0 0 0-2.5-2.5h-2.2l-.6-1.4a1 1 0 0 0-.9-.6H9.2z" fill="white"/>
        <circle cx="12" cy="13" r="4" fill="#D8560F" stroke="white" stroke-width="1.4"/>
        <circle cx="17.2" cy="9.4" r=".9" fill="#D8560F"/>
      </svg>
      Foto
    </button>
    <button type="button" class="btn-secundario" id="btn-archivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/><path d="M14 3v5h5" stroke-linejoin="round"/></svg>
      Galería
    </button>
    <button type="button" class="btn-secundario" id="btn-audio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/><path d="M12 17.5V21" stroke-linecap="round"/></svg>
      <span id="btn-audio-texto">Audio</span>
    </button>
  </div>

  <div id="chat-bar">
    <input type="text" id="chat-texto" placeholder="Escribe o dicta…" autocomplete="off">
    <button type="button" id="btn-dictar" class="btn-circular" aria-label="Dictar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/><path d="M12 17.5V21" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="btn-enviar" class="btn-circular" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL = "https://sshctqnpuolawtcujxkt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzaGN0cW5wdW9sYXd0Y3VqeGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDMxNDQsImV4cCI6MjEwNDUxOTE0NH0.NgqSwwtdQjKot2kiCabmF6f_kvl-27QU1kWgfzYPFsQ";
  const BUCKET = "documentos-exg";
  const LS_KEY = "exg_historial_mensajes";
  const LS_KEY_OLD = "exg_historial_subidas"; // formato antiguo, se migra al cargar

  const btnFoto = document.getElementById("btn-foto");
  const btnArchivo = document.getElementById("btn-archivo");
  const btnAudio = document.getElementById("btn-audio");
  const btnAudioTexto = document.getElementById("btn-audio-texto");
  const campoCamara = document.getElementById("campo-camara");
  const campoArchivo = document.getElementById("campo-archivo");
  const campoAnadir = document.getElementById("campo-anadir");
  const pendientesStrip = document.getElementById("pendientes-strip");
  const feed = document.getElementById("feed");
  const vacio = document.getElementById("vacio");
  const chatTexto = document.getElementById("chat-texto");
  const btnDictar = document.getElementById("btn-dictar");
  const btnEnviar = document.getElementById("btn-enviar");
  const detalle = document.getElementById("detalle");
  const detalleContenido = document.getElementById("detalle-contenido");
  const menuAnadir = document.getElementById("menu-anadir");

  const ICONO_TIPO = {foto:'📷', audio:'🎙'};

  // ---------- Historial (modelo: 1 mensaje = 1 o varios adjuntos) ----------
  function leerHistorial(){
    try { return JSON.parse(localStorage.getItem(LS_KEY) || "null") || migrarViejoSinLotes(); }
    catch(e){ return []; }
  }
  function migrarViejoSinLotes(){
    // Formato antiguo: una entrada por archivo, sin lote_id guardado localmente
    try {
      const viejo = JSON.parse(localStorage.getItem(LS_KEY_OLD) || "[]");
      if (viejo.length === 0) return [];
      const porClaveProvisional = {};
      viejo.forEach(h => {
        const clave = "solo-" + h.documento_id; // se reagrupará de verdad contra Supabase al arrancar
        porClaveProvisional[clave] = { msg_id: clave, nota: h.nota || null, created_at: h.created_at, kind: h.kind === "texto" ? "texto" : "multimedia", attachments: h.kind !== "texto" ? [{ documento_id: h.documento_id, kind: h.kind, file_url: h.file_url, storage_path: h.storage_path }] : [], documento_id: h.kind === "texto" ? h.documento_id : undefined };
      });
      const migrado = Object.values(porClaveProvisional);
      guardarHistorial(migrado);
      return migrado;
    } catch(e){ return []; }
  }

  // Se ejecuta una vez al arrancar: agrupa de verdad contra el lote_id real de Supabase,
  // por si el historial local quedó con mensajes separados que en realidad son el mismo envío.
  async function repararAgrupacionHistorial(){
    const lista = leerHistorial();
    if (lista.length === 0) return;
    const idsPorMsg = [];
    lista.forEach(m => {
      const ids = m.kind === "texto" ? (m.documento_id ? [m.documento_id] : []) : (m.attachments || []).map(a => a.documento_id);
      ids.forEach(id => idsPorMsg.push(id));
    });
    const idsUnicos = [...new Set(idsPorMsg)].filter(Boolean);
    if (idsUnicos.length === 0) return;
    let mapaLote = {};
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/documentos?id=in.(${idsUnicos.join(",")})&select=id,lote_id`, { headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY } });
      const filas = await resp.json();
      if (Array.isArray(filas)) filas.forEach(f => { mapaLote[f.id] = f.lote_id; });
    } catch(e){ return; }

    const porLoteReal = {};
    let huboCambio = false;
    lista.forEach(m => {
      if (m.kind === "texto"){
        const clave = (m.documento_id && mapaLote[m.documento_id]) || m.msg_id;
        if (clave !== m.msg_id) huboCambio = true;
        if (!porLoteReal[clave]) porLoteReal[clave] = { ...m, msg_id: clave };
        return;
      }
      (m.attachments || []).forEach(a => {
        const clave = (a.documento_id && mapaLote[a.documento_id]) || m.msg_id;
        if (clave !== m.msg_id) huboCambio = true;
        if (!porLoteReal[clave]) porLoteReal[clave] = { msg_id: clave, nota: m.nota, created_at: m.created_at, kind: "multimedia", attachments: [] };
        porLoteReal[clave].attachments.push(a);
      });
    });
    if (huboCambio){
      const reagrupado = Object.values(porLoteReal).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      guardarHistorial(reagrupado);
    }
  }
  function guardarHistorial(lista){ try { localStorage.setItem(LS_KEY, JSON.stringify(lista.slice(0,200))); } catch(e){} }
  function añadirAlHistorial(msg){ guardarHistorial([msg, ...leerHistorial()]); }
  function actualizarMsgEnHistorial(msgId, cambios){
    const lista = leerHistorial();
    const i = lista.findIndex(m => m.msg_id === msgId);
    if (i >= 0){ lista[i] = { ...lista[i], ...cambios }; guardarHistorial(lista); }
    return lista[i];
  }

  // ---------- Pendientes (cola antes de enviar) ----------
  let pendientes = [];
  let subiendo = false;

  btnFoto.addEventListener("click", () => campoCamara.click());
  btnArchivo.addEventListener("click", () => campoArchivo.click());
  campoCamara.addEventListener("change", async () => {
    const destino = campoCamara.dataset.destino;
    const f = campoCamara.files[0];
    campoCamara.value = "";
    campoCamara.dataset.destino = "";
    if (destino === "anadir" && f) { await adjuntarArchivoAMensaje(loteObjetivoActual, f, "foto"); return; }
    if (f) añadirArchivos([f]);
  });
  campoArchivo.addEventListener("change", () => { añadirArchivos(campoArchivo.files); campoArchivo.value = ""; });

  function añadirArchivos(fileList){
    Array.from(fileList).forEach(f => {
      pendientes.push({ id: "f" + Date.now() + Math.random().toString(36).slice(2), kind: "foto", file: f, previewUrl: URL.createObjectURL(f) });
    });
    renderPendientes();
  }
  function quitarPendiente(id){ pendientes = pendientes.filter(p => p.id !== id); renderPendientes(); }
  window.quitarPendiente = quitarPendiente;

  function renderPendientes(){
    if (pendientes.length === 0){ pendientesStrip.classList.remove("activo"); pendientesStrip.innerHTML = ""; btnEnviar.disabled = chatTexto.value.trim() === ""; return; }
    pendientesStrip.classList.add("activo");
    pendientesStrip.innerHTML = pendientes.map(p => {
      const cuerpo = p.kind === "audio"
        ? `<div class="pend-audio" onclick="reproducirPendiente('${p.id}')"><svg id="pico-${p.id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/></svg><span class="play-badge"><svg viewBox="0 0 24 24" fill="white"><path d="M6 4l14 8-14 8z"/></svg></span></div>`
        : `<img src="${p.previewUrl}" alt="">`;
      return `<div class="pend-item">${cuerpo}<button type="button" class="pend-borrar" onclick="event.stopPropagation();quitarPendiente('${p.id}')">✕</button></div>`;
    }).join("");
    btnEnviar.disabled = subiendo;
  }

  const ICONO_MIC = `<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/>`;
  const ICONO_PAUSA = `<rect x="7" y="5" width="4" height="14" rx="1"/><rect x="13" y="5" width="4" height="14" rx="1"/>`;
  let audioReproduciendo = null, idReproduciendo = null;
  function pararAudioActual(){ if (audioReproduciendo) audioReproduciendo.pause(); idReproduciendo = null; }
  function reproducirPendiente(id){
    const p = pendientes.find(x => x.id === id);
    if (!p) return;
    const icono = document.getElementById(`pico-${id}`);
    if (idReproduciendo === id){ pararAudioActual(); if (icono) icono.innerHTML = ICONO_MIC; return; }
    pararAudioActual();
    audioReproduciendo = new Audio(p.previewUrl);
    idReproduciendo = id;
    if (icono) icono.innerHTML = ICONO_PAUSA;
    audioReproduciendo.onended = () => { idReproduciendo = null; if (icono) icono.innerHTML = ICONO_MIC; };
    audioReproduciendo.play().catch(() => {});
  }
  window.reproducirPendiente = reproducirPendiente;
  function reproducirUrl(url, id){
    if (idReproduciendo === id){ pararAudioActual(); return; }
    pararAudioActual();
    audioReproduciendo = new Audio(url);
    idReproduciendo = id;
    audioReproduciendo.onended = () => { idReproduciendo = null; };
    audioReproduciendo.play().catch(() => {});
  }
  window.reproducirUrl = reproducirUrl;

  // ---------- Grabar audio ----------
  let grabando = false, mediaRecorder = null, audioChunks = [], audioStream = null, grabarInicio = null, grabarTimer = null;
  let grabarDestino = "pendientes"; // "pendientes" o msg_id cuando se graba para añadir a un mensaje existente
  btnAudio.addEventListener("click", () => { grabarDestino = "pendientes"; if (grabando) pararGrabacion(); else empezarGrabacion(); });

  async function empezarGrabacion(){
    try { audioStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(e){ mostrarAviso("No se pudo acceder al micrófono"); return; }
    const candidatos = ["audio/mp4", "audio/webm", "audio/aac"];
    const mime = candidatos.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    mediaRecorder = mime ? new MediaRecorder(audioStream, { mimeType: mime }) : new MediaRecorder(audioStream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const tipo = mediaRecorder.mimeType || "audio/webm";
      const blob = new Blob(audioChunks, { type: tipo });
      const extension = tipo.includes("mp4") ? "m4a" : tipo.includes("aac") ? "aac" : "webm";
      const file = new File([blob], `audio-${Date.now()}.${extension}`, { type: tipo });
      audioStream.getTracks().forEach(t => t.stop());
      audioStream = null;
      if (grabarDestino === "pendientes"){
        pendientes.push({ id: "a" + Date.now() + Math.random().toString(36).slice(2), kind: "audio", file, previewUrl: URL.createObjectURL(blob) });
        renderPendientes();
      } else {
        await adjuntarArchivoAMensaje(grabarDestino, file, "audio");
      }
    };
    mediaRecorder.start();
    grabarInicio = Date.now();
    grabando = true;
    btnAudio.classList.add("grabando");
    grabarTimer = setInterval(() => { btnAudioTexto.textContent = `${Math.round((Date.now() - grabarInicio)/1000)}s`; }, 500);
  }
  function pararGrabacion(){
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    grabando = false;
    btnAudio.classList.remove("grabando");
    btnAudioTexto.textContent = "Audio";
    if (grabarTimer) { clearInterval(grabarTimer); grabarTimer = null; }
  }

  // ---------- Dictado ----------
  const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (esIOS) { btnDictar.style.display = "none"; }
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let reconocimiento = null, dictando = false, textoAntesDeDictar = "";
  if (SpeechRec) {
    reconocimiento = new SpeechRec();
    reconocimiento.lang = "es-ES"; reconocimiento.continuous = true; reconocimiento.interimResults = true;
    reconocimiento.onresult = (e) => {
      let texto = ""; for (let i=0;i<e.results.length;i++) texto += e.results[i][0].transcript;
      chatTexto.value = (textoAntesDeDictar + " " + texto).trim();
      renderPendientes();
    };
    reconocimiento.onerror = () => { pararDictado(); mostrarAviso("No se pudo dictar."); };
    reconocimiento.onend = () => { if (dictando) pararDictado(); };
  }
  function empezarDictado(){
    if (!reconocimiento) { mostrarAviso("Dictado no disponible — usa el micrófono del teclado."); return; }
    textoAntesDeDictar = chatTexto.value; dictando = true; btnDictar.classList.add("escuchando");
    try { reconocimiento.start(); } catch(e){}
  }
  function pararDictado(){ dictando = false; btnDictar.classList.remove("escuchando"); if (reconocimiento) { try { reconocimiento.stop(); } catch(e){} } }
  btnDictar.addEventListener("click", () => { if (dictando) pararDictado(); else empezarDictado(); });

  chatTexto.addEventListener("input", renderPendientes);
  chatTexto.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); enviar(); } });
  btnEnviar.addEventListener("click", enviar);

  function mostrarAviso(msg){
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<div class="msg-cuerpo"><div class="msg-texto">${msg}</div></div>`;
    feed.appendChild(div);
    vacio.style.display = "none";
    feed.scrollTop = feed.scrollHeight;
    setTimeout(() => div.remove(), 3000);
  }
  function fechaCorta(iso){ return new Date(iso).toLocaleString("es-ES", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); }

  async function subirArchivo(file, kind, fechaISO){
    const fecha = fechaISO.slice(0,10);
    const extension = (file.name.split(".").pop() || (kind === "audio" ? "webm" : "jpg")).toLowerCase();
    const carpeta = kind === "audio" ? "audios" : "gastos";
    const nombreArchivo = `sin-clasificar/${carpeta}/${fecha}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${extension}`;
    const subidaResp = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${nombreArchivo}`, {
      method:"POST",
      headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type": file.type || (kind==="audio"?"audio/webm":"image/jpeg") },
      body: file
    });
    if (!subidaResp.ok) throw new Error("storage " + subidaResp.status);
    const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${nombreArchivo}`;
    return { nombreArchivo, fileUrl, fecha };
  }

  async function crearDocumento({ fecha, storage_path, file_name, file_url, source, nota, lote_id }){
    const filaResp = await fetch(`${SUPABASE_URL}/rest/v1/documentos`, {
      method:"POST",
      headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json", "Prefer":"return=representation" },
      body: JSON.stringify({ tipo:"otro", fecha, storage_path, file_name, file_url, source, status:"pendiente", lote_id, nota })
    });
    if (!filaResp.ok) throw new Error("tabla " + filaResp.status);
    const filaCreada = await filaResp.json();
    return filaCreada?.[0]?.id;
  }

  function dispararProcesado(documentoId, kind){
    if (kind === "foto"){
      fetch(`${SUPABASE_URL}/functions/v1/clasificar-documento`, { method:"POST", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" }, body: JSON.stringify({ documento_id: documentoId }) })
        .then(() => actualizarPill(documentoId)).catch(() => {});
    } else if (kind === "audio"){
      fetch(`${SUPABASE_URL}/functions/v1/transcribir-audio`, { method:"POST", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" }, body: JSON.stringify({ documento_id: documentoId }) })
        .then(() => fetch(`${SUPABASE_URL}/functions/v1/procesar-entrada`, { method:"POST", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" }, body: JSON.stringify({ documento_id: documentoId }) }))
        .then(() => actualizarPill(documentoId)).catch(() => {});
    }
  }

  // ---------- Envío: un mensaje = un lote (aunque tenga varios adjuntos) ----------
  async function enviar(){
    if (subiendo) return;
    const notaTexto = chatTexto.value.trim() || null;
    if (pendientes.length === 0 && !notaTexto) return;
    subiendo = true;
    btnEnviar.disabled = true;
    vacio.style.display = "none";

    const loteId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2));
    const items = pendientes.slice();
    pendientes = [];
    renderPendientes();
    chatTexto.value = "";
    const ahoraISO = new Date().toISOString();

    if (items.length === 0){
      try {
        const documentoId = await crearDocumento({ fecha: ahoraISO.slice(0,10), storage_path: null, file_name: null, file_url: null, source: "texto", nota: notaTexto, lote_id: loteId });
        const msg = { msg_id: loteId, kind: "texto", nota: notaTexto, documento_id: documentoId, attachments: [], created_at: ahoraISO };
        añadirAlHistorial(msg);
        pintarMensaje(msg);
        fetch(`${SUPABASE_URL}/functions/v1/procesar-entrada`, { method:"POST", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" }, body: JSON.stringify({ documento_id: documentoId }) })
          .then(() => actualizarPill(loteId)).catch(() => {});
      } catch(e){ mostrarAviso("No se pudo enviar. Inténtalo otra vez."); }
      subiendo = false; btnEnviar.disabled = false;
      return;
    }

    const attachments = [];
    for (const p of items){
      try {
        const { nombreArchivo, fileUrl, fecha } = await subirArchivo(p.file, p.kind, ahoraISO);
        const documentoId = await crearDocumento({ fecha, storage_path: nombreArchivo, file_name: p.file.name, file_url: fileUrl, source: p.kind, nota: notaTexto, lote_id: loteId });
        attachments.push({ documento_id: documentoId, kind: p.kind, file_url: fileUrl, storage_path: nombreArchivo });
        dispararProcesado(documentoId, p.kind);
      } catch(e){ /* se informa al final si no hay ningún adjunto */ }
    }
    if (attachments.length === 0){ mostrarAviso("No se pudo enviar. Inténtalo otra vez."); subiendo = false; btnEnviar.disabled = false; return; }

    const msg = { msg_id: loteId, kind: "multimedia", nota: notaTexto, attachments, created_at: ahoraISO };
    añadirAlHistorial(msg);
    pintarMensaje(msg);
    subiendo = false; btnEnviar.disabled = pendientes.length===0 && chatTexto.value.trim()==="";
  }

  async function actualizarPill(msgId){
    const m = leerHistorial().find(x => x.msg_id === msgId);
    if (!m) return;
    const ids = m.kind === "texto" ? [m.documento_id] : m.attachments.map(a => a.documento_id);

      const filas = await resp.json();
      if (!Array.isArray(filas) || filas.length === 0) return;
      const estados = filas.map(f => f.status || "pendiente");
      const status = estados.includes("revisar") ? "revisar" : estados.every(s => s === "verificado") ? "verificado" : estados.every(s => s === "validado" || s === "verificado") ? "validado" : "pendiente";
      const pill = document.getElementById(`pill-${msgId}`);
      if (pill){ pill.className = "msg-pill " + status; pill.textContent = status === "pendiente" ? "Sin revisar" : status === "revisar" ? "Revisar" : status === "verificado" ? "✓ Verificado" : "Añadido"; }

      const linkedLabel = filas.find(f => f.linked_label)?.linked_label;
      const actionType = filas.find(f => f.action_type)?.action_type;
      const esFlota = actionType === 'flota_incidencia' || actionType === 'flota_incidencias' || (linkedLabel && linkedLabel.toLowerCase().includes('iveco'));
      const esVerificado = status === 'verificado';

      const msgDiv = feed.querySelector(`.msg[data-msg-id="${msgId}"]`);
      const cuerpo = msgDiv?.querySelector(".msg-cuerpo");
      if (cuerpo){
        let caja = cuerpo.querySelector(".msg-interpretacion");
        if (!caja){ caja = document.createElement("div"); caja.className = "msg-interpretacion"; caja.style.cssText = "margin-top:6px;padding:8px 10px;border-radius:9px;font-size:12px;line-height:1.4;"; cuerpo.appendChild(caja); }

        if (esVerificado && linkedLabel){
          // Verificado: mostrar botón "Ver solución"
          caja.style.background = "var(--green-soft)"; caja.style.color = "var(--green)";
          const elementoId = filas.find(f => f.interpretacion?.elemento_id)?.interpretacion?.elemento_id || null;
          const docIds = filas.map(f=>f.id).join(',');
          caja.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <span style="flex:1;">✓ ${linkedLabel.replace('✓ ','').replace('verificado','').replace('Verificado','').trim().replace(/[—-]\s*$/,'').trim()}</span>
            <button onclick="mostrarSolucionPorIds('${docIds}')" style="flex-shrink:0;padding:3px 8px;border-radius:6px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:11px;cursor:pointer;">Ver solución →</button>
          </div>`;
        } else if (esFlota){
          caja.style.background = "var(--green-soft)"; caja.style.color = "var(--green)";
          caja.textContent = "→ Registrado en flota";
        } else if (interp){
          if (interp.estado_resolucion === "resuelto"){
            caja.style.background = "var(--green-soft)"; caja.style.color = "var(--green)";
            caja.textContent = `${interp.trabajo_nombre}${interp.cliente_nombre ? ' — ' + interp.cliente_nombre : ''} · ${interp.concepto}${interp.horas ? ' · ' + interp.horas + 'h' : ''}${interp.maquina ? ' · ' + interp.maquina : ''} · ${interp.fecha}`;
          } else {
            caja.style.background = "var(--orange-soft)"; caja.style.color = "var(--orange)";
            caja.textContent = interp.estado_resolucion === "trabajo_no_encontrado" ? "No encuentro ese trabajo — edita para especificarlo" : "No sé a qué trabajo pertenece — nombra el cliente/obra";
          }
        }
      }

      // Plegar mensajes verificados
      if (esVerificado && msgDiv){
        msgDiv.classList.add('msg-verificado');
        if (!msgDiv.classList.contains('msg-expandido')){
          msgDiv.classList.add('msg-plegado');
        }
      }
    } catch(e){}
  }

  function cargarFeedInicial(){
    const lista = leerHistorial();
    if (lista.length === 0){ vacio.style.display = "block"; return; }
    lista.slice().reverse().forEach(m => pintarMensaje(m));
  }

  // ---------- Añadir a un mensaje existente ----------
  let loteObjetivoActual = null;
  function abrirMenuAnadir(msgId){ loteObjetivoActual = msgId; menuAnadir.classList.add("activo"); }
  window.abrirMenuAnadir = abrirMenuAnadir;
  window.mostrarSolucionPorIds = mostrarSolucionPorIds;
  window.abrirEnlaceDesdeSubir = abrirEnlaceDesdeSubir;
  window.toggleMsgVerificado = toggleMsgVerificado;
  menuAnadir.addEventListener("click", (e) => { if (e.target === menuAnadir) menuAnadir.classList.remove("activo"); });
  document.getElementById("ma-foto").addEventListener("click", () => { menuAnadir.classList.remove("activo"); campoCamara.dataset.destino = "anadir"; campoCamara.click(); });
  document.getElementById("ma-archivo").addEventListener("click", () => { menuAnadir.classList.remove("activo"); campoAnadir.click(); });
  document.getElementById("ma-audio").addEventListener("click", () => { menuAnadir.classList.remove("activo"); grabarDestino = loteObjetivoActual; empezarGrabacion(); });
  campoAnadir.addEventListener("change", async () => {
    const f = campoAnadir.files[0];
    campoAnadir.value = "";
    if (f) await adjuntarArchivoAMensaje(loteObjetivoActual, f, "foto");
  });

  async function adjuntarArchivoAMensaje(msgId, file, kind){
    const m = leerHistorial().find(x => x.msg_id === msgId);
    if (!m) return;
    try {
      const ahoraISO = new Date().toISOString();
      const { nombreArchivo, fileUrl, fecha } = await subirArchivo(file, kind, ahoraISO);
      const documentoId = await crearDocumento({ fecha, storage_path: nombreArchivo, file_name: file.name, file_url: fileUrl, source: kind, nota: m.nota, lote_id: msgId });
      const nuevoAdjunto = { documento_id: documentoId, kind, file_url: fileUrl, storage_path: nombreArchivo };
      const nuevosAttachments = [...(m.attachments || []), nuevoAdjunto];
      const actualizado = actualizarMsgEnHistorial(msgId, { attachments: nuevosAttachments, kind: "multimedia" });
      const divExistente = feed.querySelector(`.msg[data-msg-id="${msgId}"]`);
      if (divExistente) reconstruirMensaje(divExistente, actualizado); else pintarMensaje(actualizado);
      dispararProcesado(documentoId, kind);
    } catch(e){ mostrarAviso("No se pudo añadir. Inténtalo otra vez."); }
  }
  // (el listener de campoCamara ya está fusionado arriba, decide destino por dataset.destino)

  // ---------- Editar (nota compartida del mensaje) ----------
  function editarMensaje(msgId){
    const div = feed.querySelector(`.msg[data-msg-id="${msgId}"]`);
    if (!div) return;
    const m = leerHistorial().find(x => x.msg_id === msgId);
    if (!m) return;
    const textoEl = div.querySelector(".msg-texto");
    let elemento = textoEl;
    if (!elemento){
      elemento = document.createElement("div");
      elemento.className = "msg-texto";
      div.querySelector(".msg-cuerpo").prepend(elemento);
    }
    if (elemento.isContentEditable) return;
    elemento.textContent = m.nota || "";
    elemento.contentEditable = "true";
    elemento.style.outline = "1.5px solid var(--orange)"; elemento.style.borderRadius = "8px"; elemento.style.padding = "4px 6px";
    elemento.focus();
    const range = document.createRange(); range.selectNodeContents(elemento); range.collapse(false);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);

    const guardar = async () => {
      elemento.contentEditable = "false"; elemento.style.outline = ""; elemento.style.padding = "";
      const nuevoTexto = elemento.textContent.trim();
      const ids = m.kind === "texto" ? [m.documento_id] : m.attachments.map(a => a.documento_id);
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/documentos?id=in.(${ids.join(",")})`, {
          method:"PATCH",
          headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" },
          body: JSON.stringify({ nota: nuevoTexto || null })
        });
      } catch(e){}
      actualizarMsgEnHistorial(msgId, { nota: nuevoTexto || null });
      elemento.textContent = m.attachments && m.attachments.length > 0 ? (nuevoTexto ? `"${nuevoTexto}"` : "") : nuevoTexto;
      if (m.kind === "texto" && nuevoTexto){
        fetch(`${SUPABASE_URL}/functions/v1/procesar-entrada`, { method:"POST", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" }, body: JSON.stringify({ documento_id: m.documento_id }) })
          .then(() => actualizarPill(msgId)).catch(() => {});
      }
    };
    elemento.addEventListener("blur", guardar, { once: true });
    elemento.addEventListener("keydown", (e) => { if (e.key === "Enter"){ e.preventDefault(); elemento.blur(); } });
  }
  window.editarMensaje = editarMensaje;

  // ---------- Borrar (con confirmación) ----------
  async function borrarMensaje(msgId){
    if (!confirm("¿Eliminar este mensaje? No se puede deshacer.")) return;
    const lista = leerHistorial();
    const m = lista.find(x => x.msg_id === msgId);
    if (!m) return;
    try {
      const rutas = (m.attachments || []).map(a => a.storage_path).filter(Boolean);
      for (const ruta of rutas){
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${ruta}`, { method:"DELETE", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY } });
      }
      const ids = m.kind === "texto" ? [m.documento_id] : m.attachments.map(a => a.documento_id);
      if (ids.length > 0){
        await fetch(`${SUPABASE_URL}/rest/v1/documentos?id=in.(${ids.join(",")})`, { method:"DELETE", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY } });
      }
    } catch(e){}
    guardarHistorial(lista.filter(x => x.msg_id !== msgId));
    const div = feed.querySelector(`.msg[data-msg-id="${msgId}"]`);
    if (div) div.remove();
    if (leerHistorial().length === 0) vacio.style.display = "block";
  }
  window.borrarMensaje = borrarMensaje;

  // ---------- Ficha de detalle ----------
  function abrirDetalleAdjunto(fileUrl){
    detalleContenido.innerHTML = `<img src="${fileUrl}" alt="">`;
    detalle.classList.add("activo");
  }
  window.abrirDetalleAdjunto = abrirDetalleAdjunto;
  document.getElementById("detalle-cerrar").addEventListener("click", () => detalle.classList.remove("activo"));
  detalle.addEventListener("click", (e) => { if (e.target === detalle) detalle.classList.remove("activo"); });

  renderPendientes();
  repararAgrupacionHistorial().finally(cargarFeedInicial);
})();
</script>

</body>
</html>
