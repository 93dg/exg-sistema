<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXG — Subir</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXG">
<meta name="theme-color" content="#1B1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1B1F24;
  --concrete:#EEECE6;
  --paper:#FBFAF7;
  --line:#E3DFD3;
  --ink:#1B1F24;
  --ink-soft:#6B7178;
  --orange:#D8560F;
  --orange-soft:#FBE4D6;
  --green:#3C6E47;
  --green-soft:#DCE8DD;
  --red:#B23A2E;
  --red-soft:#F3D9D5;
  --blue:#2E5FB2;
  --blue-soft:#DCE5F5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--concrete);
  color:var(--ink);
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  overflow-x:hidden;
}
svg{display:block;}

/* ---------- Header compacto ---------- */
header{
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
header .name{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;letter-spacing:.01em;}
#tabs{display:flex;gap:2px;background:var(--concrete);border-radius:9px;padding:2px;}
.tab-btn{
  -webkit-appearance:none;appearance:none;border:none;background:none;
  padding:6px 13px;border-radius:7px;
  font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink-soft);
}
.tab-btn.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(27,31,36,0.08);}

.vista{display:none;flex:1;min-height:0;}
.vista.activa{display:flex;flex-direction:column;}

/* ---------- Zona de captura (arriba, alcance del pulgar) ---------- */
#captura{padding:14px 16px 8px;}

#btn-foto{
  -webkit-appearance:none;appearance:none;border:none;
  width:100%;
  background:var(--orange);color:#fff;
  border-radius:14px;
  padding:15px 18px;
  display:flex;align-items:center;gap:12px;
  font-family:'Inter',sans-serif;font-size:16px;font-weight:700;
}
#btn-foto:active{background:#c14c0d;}
#btn-foto svg{width:24px;height:24px;flex:0 0 24px;}

.acciones-secundarias{display:flex;gap:8px;margin-top:8px;}
.btn-secundario{
  -webkit-appearance:none;appearance:none;border:1.5px solid var(--line);background:var(--paper);
  flex:1;border-radius:12px;padding:11px 10px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);
}
.btn-secundario:active{background:var(--concrete);}
.btn-secundario svg{width:18px;height:18px;flex:0 0 18px;color:var(--ink-soft);}
.btn-secundario.grabando{background:var(--red);border-color:var(--red);color:#fff;}
.btn-secundario.grabando svg{color:#fff;animation:pulso 1s infinite;}
@keyframes pulso{0%,100%{opacity:1;}50%{opacity:.5;}}

#campo-camara,#campo-archivo{display:none;}

/* ---------- Cola de pendientes (compacta) ---------- */
#pendientes-strip{display:none;gap:8px;padding:0 16px 8px;overflow-x:auto;}
#pendientes-strip.activo{display:flex;}
.pend-item{
  position:relative;flex:0 0 auto;
  width:56px;height:56px;border-radius:10px;overflow:hidden;
  border:1.5px solid var(--line);background:var(--asphalt);
}
.pend-item img{width:100%;height:100%;object-fit:cover;display:block;}
.pend-item .pend-audio{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;}
.pend-item .pend-audio svg{width:20px;height:20px;}
.pend-item .pend-borrar{
  position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;
  background:rgba(27,31,36,0.8);border:none;color:#fff;font-size:10px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- Feed de resultados (aparece tras enviar) ---------- */
#feed{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column-reverse;gap:10px;}
.resultado-card{
  background:var(--paper);border:1.5px solid var(--line);border-radius:13px;
  padding:12px;display:flex;flex-direction:column;gap:9px;
  animation:aparecer .2s ease;
}
@keyframes aparecer{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.rc-fila{display:flex;gap:10px;align-items:flex-start;}
.rc-thumb{
  width:44px;height:44px;border-radius:9px;flex:0 0 44px;
  object-fit:cover;background:var(--asphalt);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.rc-thumb svg{width:19px;height:19px;}
.rc-cuerpo{flex:1;min-width:0;}
.rc-titulo{font-size:13.5px;font-weight:700;color:var(--ink);}
.rc-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.rc-texto{font-size:13px;color:var(--ink);margin-top:5px;line-height:1.4;}
.rc-estado{
  flex:0 0 auto;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.02em;
}
.rc-estado.cargando{background:var(--concrete);color:var(--ink-soft);}
.rc-estado.ok{background:var(--green-soft);color:var(--green);}
.rc-estado.enviado{background:var(--blue-soft);color:var(--blue);}

.rc-chips{display:flex;gap:6px;flex-wrap:wrap;}
.rc-chip{
  -webkit-appearance:none;appearance:none;border:1.3px solid var(--line);background:var(--paper);
  border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink);
}
.rc-chip.elegido{background:var(--orange);border-color:var(--orange);color:#fff;}
.rc-chip.confirmar{background:var(--asphalt);border-color:var(--asphalt);color:#fff;}

#vacio{margin:auto;text-align:center;color:var(--ink-soft);font-size:13.5px;padding:20px;}

/* ---------- Historial ---------- */
#historial-lista{flex:1;overflow-y:auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px;}
.hist-item{
  display:flex;align-items:center;gap:11px;padding:9px;border-radius:11px;
  background:var(--paper);border:1.5px solid var(--line);
}
.hist-thumb{
  width:42px;height:42px;border-radius:8px;object-fit:cover;flex:0 0 42px;
  background:var(--asphalt);display:flex;align-items:center;justify-content:center;color:#fff;
}
.hist-thumb svg{width:17px;height:17px;}
.hist-info{flex:1;min-width:0;}
.hist-titulo{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;display:flex;gap:6px;align-items:center;}
.hist-pill{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:20px;text-transform:uppercase;}
.hist-pill.pendiente{background:var(--concrete);color:var(--ink-soft);}
.hist-pill.revisar{background:var(--orange-soft);color:var(--orange);}
.hist-pill.validado{background:var(--green-soft);color:var(--green);}
.hist-borrar{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:none;
  background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;
}
.hist-borrar svg{width:14px;height:14px;}
#historial-vacio{margin:auto;text-align:center;color:var(--ink-soft);font-size:13.5px;padding:20px;}

/* ---------- Ficha de detalle (historial) ---------- */
#detalle{
  position:fixed;inset:0;z-index:100;background:rgba(27,31,36,0.55);
  display:none;align-items:flex-end;justify-content:center;
}
#detalle.activo{display:flex;}
#detalle-panel{
  width:100%;max-width:480px;background:var(--paper);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:80vh;overflow-y:auto;
}
#detalle-panel img{width:100%;border-radius:11px;margin-bottom:10px;}
#detalle-panel audio{width:100%;margin-bottom:10px;}
#detalle-cerrar{
  width:32px;height:32px;border-radius:50%;background:var(--concrete);border:none;
  display:flex;align-items:center;justify-content:center;float:right;
}
#detalle-cerrar svg{width:15px;height:15px;}

/* ---------- Barra inferior: solo texto + dictar + enviar ---------- */
#barra-inferior{
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:var(--paper);border-top:1px solid var(--line);
}
#chat-bar{display:flex;gap:7px;align-items:center;}
#chat-texto{
  flex:1;border:1.5px solid var(--line);border-radius:21px;padding:10px 15px;
  font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:#fff;
}
#chat-texto:focus{outline:none;border-color:var(--orange);}
.btn-circular{
  -webkit-appearance:none;appearance:none;border:none;
  width:40px;height:40px;border-radius:50%;flex:0 0 40px;
  display:flex;align-items:center;justify-content:center;
}
.btn-circular svg{width:18px;height:18px;}
#btn-dictar{background:var(--concrete);color:var(--ink);}
#btn-dictar.escuchando{background:var(--red);color:#fff;}
#btn-dictar.escuchando svg{animation:pulso 1s infinite;}
#btn-enviar{background:var(--orange);color:#fff;}
#btn-enviar:disabled{background:var(--line);color:var(--ink-soft);}
</style>
</head>
<body>

<header>
  <div class="name">EXG</div>
  <div id="tabs">
    <button type="button" class="tab-btn active" id="tab-subir" onclick="cambiarVista('subir')">Subir</button>
    <button type="button" class="tab-btn" id="tab-historial" onclick="cambiarVista('historial')">Historial</button>
  </div>
</header>

<main id="vista-subir" class="vista activa">
  <div id="captura">
    <button type="button" id="btn-foto">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-2h7l1 2H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" stroke="white" stroke-width="1.8"/></svg>
      Hacer foto
    </button>
    <div class="acciones-secundarias">
      <button type="button" class="btn-secundario" id="btn-archivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/><path d="M14 3v5h5" stroke-linejoin="round"/></svg>
        Galería / archivo
      </button>
      <button type="button" class="btn-secundario" id="btn-audio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/><path d="M12 17.5V21" stroke-linecap="round"/></svg>
        <span id="btn-audio-texto">Grabar audio</span>
      </button>
    </div>
  </div>

  <input id="campo-camara" type="file" accept="image/*" capture="environment">
  <input id="campo-archivo" type="file" accept="image/*,application/pdf" multiple>

  <div id="pendientes-strip"></div>

  <div id="feed">
    <div id="vacio">Haz una foto, sube un archivo, graba un audio o escribe abajo.</div>
  </div>
</main>

<div id="vista-historial" class="vista">
  <div id="historial-lista"></div>
  <div id="historial-vacio" style="display:none;">Aún no has subido nada desde este móvil.</div>
</div>

<div id="detalle">
  <div id="detalle-panel">
    <button type="button" id="detalle-cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
    <div style="clear:both;"></div>
    <div id="detalle-contenido"></div>
  </div>
</div>

<div id="barra-inferior">
  <div id="chat-bar">
    <input type="text" id="chat-texto" placeholder="Escribe o dicta…" autocomplete="off">
    <button type="button" id="btn-dictar" class="btn-circular" aria-label="Dictar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/><path d="M12 17.5V21" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="btn-enviar" class="btn-circular" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL = "https://sshctqnpuolawtcujxkt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzaGN0cW5wdW9sYXd0Y3VqeGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDMxNDQsImV4cCI6MjEwNDUxOTE0NH0.NgqSwwtdQjKot2kiCabmF6f_kvl-27QU1kWgfzYPFsQ";

  const btnFoto = document.getElementById("btn-foto");
  const btnArchivo = document.getElementById("btn-archivo");
  const btnAudio = document.getElementById("btn-audio");
  const btnAudioTexto = document.getElementById("btn-audio-texto");
  const campoCamara = document.getElementById("campo-camara");
  const campoArchivo = document.getElementById("campo-archivo");
  const pendientesStrip = document.getElementById("pendientes-strip");
  const feed = document.getElementById("feed");
  const vacio = document.getElementById("vacio");
  const chatTexto = document.getElementById("chat-texto");
  const btnDictar = document.getElementById("btn-dictar");
  const btnEnviar = document.getElementById("btn-enviar");
  const historialLista = document.getElementById("historial-lista");
  const historialVacio = document.getElementById("historial-vacio");
  const detalle = document.getElementById("detalle");
  const detalleContenido = document.getElementById("detalle-contenido");

  const ICONO_TIPO = {foto:'📷', audio:'🎙', texto:'💬', pdf:'📄'};

  // ---------- Vistas ----------
  function cambiarVista(v){
    document.getElementById("vista-subir").classList.toggle("activa", v === "subir");
    document.getElementById("vista-historial").classList.toggle("activa", v === "historial");
    document.getElementById("tab-subir").classList.toggle("active", v === "subir");
    document.getElementById("tab-historial").classList.toggle("active", v === "historial");
    document.getElementById("barra-inferior").style.display = (v === "subir") ? "block" : "none";
    if (v === "historial") renderHistorial();
  }
  window.cambiarVista = cambiarVista;

  // ---------- Pendientes (cola antes de enviar) ----------
  let pendientes = [];
  let subiendo = false;

  btnFoto.addEventListener("click", () => campoCamara.click());
  btnArchivo.addEventListener("click", () => campoArchivo.click());
  campoCamara.addEventListener("change", () => { añadirArchivos(campoCamara.files); campoCamara.value = ""; });
  campoArchivo.addEventListener("change", () => { añadirArchivos(campoArchivo.files); campoArchivo.value = ""; });

  function añadirArchivos(fileList){
    Array.from(fileList).forEach(f => {
      pendientes.push({
        id: "f" + Date.now() + Math.random().toString(36).slice(2),
        kind: "foto",
        file: f,
        previewUrl: URL.createObjectURL(f)
      });
    });
    renderPendientes();
  }

  function quitarPendiente(id){
    pendientes = pendientes.filter(p => p.id !== id);
    renderPendientes();
  }
  window.quitarPendiente = quitarPendiente;

  function renderPendientes(){
    if (pendientes.length === 0){ pendientesStrip.classList.remove("activo"); pendientesStrip.innerHTML = ""; btnEnviar.disabled = chatTexto.value.trim() === ""; return; }
    pendientesStrip.classList.add("activo");
    pendientesStrip.innerHTML = pendientes.map(p => {
      const cuerpo = p.kind === "audio"
        ? `<div class="pend-audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke-linecap="round"/></svg></div>`
        : `<img src="${p.previewUrl}" alt="">`;
      return `<div class="pend-item">${cuerpo}<button type="button" class="pend-borrar" onclick="quitarPendiente('${p.id}')">✕</button></div>`;
    }).join("");
    btnEnviar.disabled = subiendo;
  }

  // ---------- Grabar audio ----------
  let grabando = false, mediaRecorder = null, audioChunks = [], audioStream = null, grabarInicio = null, grabarTimer = null;

  btnAudio.addEventListener("click", () => { if (grabando) pararGrabacion(); else empezarGrabacion(); });

  async function empezarGrabacion(){
    try { audioStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(e){ mostrarAviso("No se pudo acceder al micrófono"); return; }
    const candidatos = ["audio/mp4", "audio/webm", "audio/aac"];
    const mime = candidatos.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    mediaRecorder = mime ? new MediaRecorder(audioStream, { mimeType: mime }) : new MediaRecorder(audioStream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const tipo = mediaRecorder.mimeType || "audio/webm";
      const blob = new Blob(audioChunks, { type: tipo });
      const duracionSeg = grabarInicio ? Math.round((Date.now() - grabarInicio) / 1000) : 0;
      const extension = tipo.includes("mp4") ? "m4a" : tipo.includes("aac") ? "aac" : "webm";
      const file = new File([blob], `audio-${Date.now()}.${extension}`, { type: tipo });
      pendientes.push({ id: "a" + Date.now() + Math.random().toString(36).slice(2), kind: "audio", file, previewUrl: URL.createObjectURL(blob), duracion: duracionSeg });
      audioStream.getTracks().forEach(t => t.stop());
      audioStream = null;
      renderPendientes();
    };
    mediaRecorder.start();
    grabarInicio = Date.now();
    grabando = true;
    btnAudio.classList.add("grabando");
    grabarTimer = setInterval(() => { btnAudioTexto.textContent = `${Math.round((Date.now() - grabarInicio)/1000)}s — parar`; }, 500);
  }
  function pararGrabacion(){
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    grabando = false;
    btnAudio.classList.remove("grabando");
    btnAudioTexto.textContent = "Grabar audio";
    if (grabarTimer) { clearInterval(grabarTimer); grabarTimer = null; }
  }

  // ---------- Dictado (oculto en iOS, usa el del teclado) ----------
  const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (esIOS) { btnDictar.style.display = "none"; }
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let reconocimiento = null, dictando = false, textoAntesDeDictar = "";
  if (SpeechRec) {
    reconocimiento = new SpeechRec();
    reconocimiento.lang = "es-ES"; reconocimiento.continuous = true; reconocimiento.interimResults = true;
    reconocimiento.onresult = (e) => {
      let texto = ""; for (let i=0;i<e.results.length;i++) texto += e.results[i][0].transcript;
      chatTexto.value = (textoAntesDeDictar + " " + texto).trim();
      renderPendientes();
    };
    reconocimiento.onerror = () => { pararDictado(); mostrarAviso("No se pudo dictar."); };
    reconocimiento.onend = () => { if (dictando) pararDictado(); };
  }
  function empezarDictado(){
    if (!reconocimiento) { mostrarAviso("Dictado no disponible — usa el micrófono del teclado."); return; }
    textoAntesDeDictar = chatTexto.value; dictando = true; btnDictar.classList.add("escuchando");
    try { reconocimiento.start(); } catch(e){}
  }
  function pararDictado(){ dictando = false; btnDictar.classList.remove("escuchando"); if (reconocimiento) { try { reconocimiento.stop(); } catch(e){} } }
  btnDictar.addEventListener("click", () => { if (dictando) pararDictado(); else empezarDictado(); });

  chatTexto.addEventListener("input", renderPendientes);
  chatTexto.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); enviar(); } });
  btnEnviar.addEventListener("click", enviar);

  function mostrarAviso(msg){
    const card = document.createElement("div");
    card.className = "resultado-card";
    card.innerHTML = `<div class="rc-texto">${msg}</div>`;
    feed.prepend(card);
    vacio.style.display = "none";
    setTimeout(() => card.remove(), 3000);
  }

  // ---------- Envío ----------
  async function enviar(){
    if (subiendo) return;
    const notaTexto = chatTexto.value.trim() || null;
    if (pendientes.length === 0 && !notaTexto) return;
    subiendo = true;
    btnEnviar.disabled = true;
    vacio.style.display = "none";

    const loteId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2));
    const items = pendientes.slice();
    pendientes = [];
    renderPendientes();
    chatTexto.value = "";

    // Mensaje de solo texto
    if (items.length === 0){
      const card = crearCardResultado({ kind:"texto" });
      try {
        const ahora = new Date();
        const filaResp = await fetch(`${SUPABASE_URL}/rest/v1/documentos`, {
          method:"POST",
          headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json", "Prefer":"return=representation" },
          body: JSON.stringify({ tipo:"otro", fecha: ahora.toISOString().slice(0,10), source:"texto", status:"pendiente", lote_id: loteId, nota: notaTexto })
        });
        if (!filaResp.ok) throw new Error("tabla " + filaResp.status);
        const filaCreada = await filaResp.json();
        const documentoId = filaCreada?.[0]?.id;
        if (documentoId) añadirAlHistorial([{ documento_id: documentoId, kind:"texto", nota: notaTexto, created_at: ahora.toISOString() }]);
        actualizarCard(card, { titulo:"Mensaje", sub: fechaCorta(ahora.toISOString()), texto: notaTexto, estado:"enviado" });
      } catch(e){
        actualizarCard(card, { titulo:"Error al enviar", estado:"error", texto:"Inténtalo otra vez." });
      }
      subiendo = false; btnEnviar.disabled = false;
      return;
    }

    // Fotos / audios
    for (const p of items){
      const card = crearCardResultado(p);
      try {
        const ahora = new Date();
        const fecha = ahora.toISOString().slice(0,10);
        const extension = (p.file.name.split(".").pop() || (p.kind === "audio" ? "webm" : "jpg")).toLowerCase();
        const carpeta = p.kind === "audio" ? "audios" : "gastos";
        const nombreArchivo = `sin-clasificar/${carpeta}/${fecha}/${ahora.getTime()}-${Math.random().toString(36).slice(2,7)}.${extension}`;

        const subidaResp = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${nombreArchivo}`, {
          method:"POST",
          headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type": p.file.type || (p.kind==="audio"?"audio/webm":"image/jpeg") },
          body: p.file
        });
        if (!subidaResp.ok) throw new Error("storage " + subidaResp.status);
        const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${nombreArchivo}`;

        const filaResp = await fetch(`${SUPABASE_URL}/rest/v1/documentos`, {
          method:"POST",
          headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json", "Prefer":"return=representation" },
          body: JSON.stringify({ tipo:"otro", fecha, storage_path: nombreArchivo, file_name: p.file.name, file_url: fileUrl, source: p.kind==="audio"?"audio":"foto", status:"pendiente", lote_id: loteId, nota: notaTexto })
        });
        if (!filaResp.ok) throw new Error("tabla " + filaResp.status);
        const filaCreada = await filaResp.json();
        const documentoId = filaCreada?.[0]?.id;

        añadirAlHistorial([{ documento_id: documentoId, kind: p.kind, file_url: fileUrl, storage_path: nombreArchivo, nota: notaTexto, created_at: ahora.toISOString() }]);
        actualizarCard(card, { titulo: p.kind === "audio" ? "Audio" : "Foto", sub: fechaCorta(ahora.toISOString()), estado:"cargando", cargandoTexto:"Analizando…" });

        // Analizar y mostrar resultado con chips corregibles
        if (p.kind === "foto"){
          analizarFoto(documentoId, card);
        } else {
          transcribirAudio(documentoId, card);
        }
      } catch(e){
        actualizarCard(card, { titulo:"Error al subir", estado:"error", texto:"Inténtalo otra vez." });
      }
    }
    subiendo = false; btnEnviar.disabled = pendientes.length===0 && chatTexto.value.trim()==="";
  }

  async function analizarFoto(documentoId, card){
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/clasificar-documento`, {
        method:"POST",
        headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ documento_id: documentoId })
      });
      const data = await resp.json();
      const a = data.analisis;
      if (!a || a.error){
        actualizarCard(card, { estado:"ok", texto:"No se pudo clasificar automáticamente — revisable en el panel." });
        return;
      }
      mostrarChipsClasificacion(card, documentoId, a);
    } catch(e){
      actualizarCard(card, { estado:"ok", texto:"Subida correctamente. Se clasificará en el panel." });
    }
  }

  async function transcribirAudio(documentoId, card){
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/transcribir-audio`, {
        method:"POST",
        headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ documento_id: documentoId })
      });
      const data = await resp.json();
      if (data.transcripcion){
        actualizarCard(card, { estado:"ok", texto: data.transcripcion });
      } else {
        actualizarCard(card, { estado:"ok", texto:"Audio subido — sin transcripción disponible todavía." });
      }
    } catch(e){
      actualizarCard(card, { estado:"ok", texto:"Audio subido correctamente." });
    }
  }

  const ETIQUETA_TIPO = { gasto:"Gasto", ingreso:"Ingreso", albaran:"Albarán", factura:"Factura", averia:"Avería", otro:"Otro" };

  function mostrarChipsClasificacion(card, documentoId, analisis){
    const sugerido = analisis.tipo_sugerido || "otro";
    const detalle = [analisis.proveedor_o_cliente, analisis.importe ? analisis.importe + " €" : null].filter(Boolean).join(" · ");
    actualizarCard(card, { estado:"ok", texto: detalle || "Detectado automáticamente" });

    const chipsWrap = document.createElement("div");
    chipsWrap.className = "rc-chips";
    const tipos = ["gasto","albaran","factura","averia","otro"];
    tipos.forEach(t => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "rc-chip" + (t === sugerido ? " elegido" : "");
      chip.textContent = ETIQUETA_TIPO[t];
      chip.onclick = () => {
        chipsWrap.querySelectorAll(".rc-chip").forEach(c => c.classList.remove("elegido"));
        chip.classList.add("elegido");
        confirmarClasificacion(documentoId, t, analisis);
      };
      chipsWrap.appendChild(chip);
    });
    const chipOk = document.createElement("button");
    chipOk.type = "button"; chipOk.className = "rc-chip confirmar"; chipOk.textContent = "✓ Correcto";
    chipOk.onclick = () => { confirmarClasificacion(documentoId, sugerido, analisis); chipsWrap.innerHTML = ""; };
    chipsWrap.appendChild(chipOk);
    card.appendChild(chipsWrap);
  }

  async function confirmarClasificacion(documentoId, tipo, analisis){
    const etiqueta = ETIQUETA_TIPO[tipo] + (analisis.proveedor_o_cliente ? " — " + analisis.proveedor_o_cliente : "") + (analisis.importe ? " · " + analisis.importe + " €" : "");
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/documentos?id=eq.${documentoId}`, {
        method:"PATCH",
        headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ status:"revisar", linked_label: etiqueta })
      });
    } catch(e){}
  }

  function crearCardResultado(p){
    const card = document.createElement("div");
    card.className = "resultado-card";
    const icono = p.kind === "audio" ? ICONO_TIPO.audio : p.kind === "texto" ? ICONO_TIPO.texto : ICONO_TIPO.foto;
    const thumb = (p.kind === "foto" && p.previewUrl) ? `<img class="rc-thumb" src="${p.previewUrl}" alt="">` : `<div class="rc-thumb">${icono}</div>`;
    card.innerHTML = `
      <div class="rc-fila">
        ${thumb}
        <div class="rc-cuerpo">
          <div class="rc-titulo">Enviando…</div>
        </div>
        <div class="rc-estado cargando">…</div>
      </div>`;
    feed.prepend(card);
    return card;
  }

  function actualizarCard(card, {titulo, sub, texto, estado, cargandoTexto}){
    const cuerpo = card.querySelector(".rc-cuerpo");
    const estadoEl = card.querySelector(".rc-estado");
    if (titulo) cuerpo.querySelector(".rc-titulo") ? (cuerpo.querySelector(".rc-titulo").textContent = titulo) : null;
    if (!cuerpo.querySelector(".rc-titulo") && titulo){ const t=document.createElement("div"); t.className="rc-titulo"; t.textContent=titulo; cuerpo.prepend(t); }
    if (sub){
      let s = cuerpo.querySelector(".rc-sub");
      if (!s){ s = document.createElement("div"); s.className = "rc-sub"; cuerpo.appendChild(s); }
      s.textContent = sub;
    }
    if (texto){
      let tx = cuerpo.querySelector(".rc-texto");
      if (!tx){ tx = document.createElement("div"); tx.className = "rc-texto"; cuerpo.appendChild(tx); }
      tx.textContent = texto;
    }
    if (estado){
      estadoEl.className = "rc-estado " + estado;
      estadoEl.textContent = estado === "cargando" ? (cargandoTexto || "…") : estado === "ok" ? "Listo" : estado === "enviado" ? "Enviado" : "Error";
    }
  }

  function fechaCorta(iso){
    return new Date(iso).toLocaleString("es-ES", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  }

  // ---------- Historial ----------
  function leerHistorial(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch(e){ return []; } }
  function guardarHistorial(lista){ try { localStorage.setItem(LS_KEY, JSON.stringify(lista.slice(0,200))); } catch(e){} }
  function añadirAlHistorial(entradas){ guardarHistorial([...entradas, ...leerHistorial()]); }

  async function renderHistorial(){
    const lista = leerHistorial();
    if (lista.length === 0){ historialLista.style.display="none"; historialVacio.style.display="block"; return; }
    historialLista.style.display="flex"; historialVacio.style.display="none";
    historialLista.innerHTML = lista.map(h => {
      const icono = h.kind === "audio" ? ICONO_TIPO.audio : h.kind === "texto" ? ICONO_TIPO.texto : ICONO_TIPO.foto;
      const thumb = (h.kind === "foto" && h.file_url) ? `<img class="hist-thumb" src="${h.file_url}" alt="">` : `<div class="hist-thumb">${icono}</div>`;
      const titulo = h.nota || (h.kind === "audio" ? "Audio" : h.kind === "texto" ? "Mensaje" : "Foto");
      return `
      <div class="hist-item" data-doc-id="${h.documento_id}" onclick="abrirDetalleHistorial(${h.documento_id})">
        ${thumb}
        <div class="hist-info">
          <div class="hist-titulo">${titulo}</div>
          <div class="hist-meta"><span class="hist-pill pendiente" id="hpill-${h.documento_id}">…</span> ${fechaCorta(h.created_at)}</div>
        </div>
        <button type="button" class="hist-borrar" onclick="event.stopPropagation();borrarDelHistorial(${h.documento_id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      </div>`;
    }).join("");

    // Cargar estado real de cada documento (pendiente/revisar/validado)
    lista.forEach(async h => {
      try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/documentos?id=eq.${h.documento_id}&select=status`, {
          headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY }
        });
        const data = await resp.json();
        const status = data?.[0]?.status || "pendiente";
        const pill = document.getElementById(`hpill-${h.documento_id}`);
        if (pill){ pill.className = "hist-pill " + status; pill.textContent = status === "pendiente" ? "Sin revisar" : status === "revisar" ? "Revisar" : status === "validado" ? "Validado" : status; }
      } catch(e){}
    });
  }

  async function abrirDetalleHistorial(documentoId){
    const h = leerHistorial().find(x => x.documento_id === documentoId);
    if (!h) return;
    let cuerpo = "";
    if (h.kind === "audio") cuerpo = `<audio controls src="${h.file_url}"></audio>`;
    else if (h.kind === "foto") cuerpo = `<img src="${h.file_url}" alt="">`;
    let extra = "";
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/documentos?id=eq.${documentoId}&select=nota,transcripcion,linked_label,status`, {
        headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY }
      });
      const data = await resp.json();
      const d = data?.[0];
      if (d){
        if (d.transcripcion) extra += `<div class="rc-texto" style="margin-bottom:8px;">${d.transcripcion}</div>`;
        if (d.nota) extra += `<div class="rc-texto" style="margin-bottom:8px;">"${d.nota}"</div>`;
        if (d.linked_label) extra += `<div class="rc-sub">${d.linked_label}</div>`;
      }
    } catch(e){}
    detalleContenido.innerHTML = cuerpo + extra;
    detalle.classList.add("activo");
  }
  window.abrirDetalleHistorial = abrirDetalleHistorial;
  document.getElementById("detalle-cerrar").addEventListener("click", () => detalle.classList.remove("activo"));
  detalle.addEventListener("click", (e) => { if (e.target === detalle) detalle.classList.remove("activo"); });

  async function borrarDelHistorial(documentoId){
    if (!confirm("¿Borrar esto? No se puede deshacer.")) return;
    const lista = leerHistorial();
    const entrada = lista.find(h => h.documento_id === documentoId);
    try {
      if (entrada?.storage_path){
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${entrada.storage_path}`, { method:"DELETE", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY } });
      }
      await fetch(`${SUPABASE_URL}/rest/v1/documentos?id=eq.${documentoId}`, { method:"DELETE", headers:{ "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY } });
    } catch(e){}
    guardarHistorial(lista.filter(h => h.documento_id !== documentoId));
    renderHistorial();
  }
  window.borrarDelHistorial = borrarDelHistorial;

  renderPendientes();
})();
</script>

</body>
